# Запуск: скопируйте .env.example → .env, затем:
#   docker compose up --build
# Сайт: http://localhost:${HOST_PORT:-8080} (внутри контейнера всегда порт 3000)
#
# HOST_PORT — порт на хосте. По умолчанию 8080, чтобы не конфликтовать с другим
# процессом/контейнером на :3000 (типичная ошибка Dokploy: «port is already allocated»).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://b24.module.team}
    ports:
      - "${HOST_PORT:-8080}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    restart: unless-stopped
